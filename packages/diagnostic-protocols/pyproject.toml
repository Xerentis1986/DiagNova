[project]
name = "diagnova-protocols"
version = "0.2.0"
description = "DiagNova diagnostic protocols: OBD-II/J1979, ISO-TP, UDS basics, capability matrix (Phase 05)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
