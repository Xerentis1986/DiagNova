# Plesk – zusätzliche Nginx-Direktiven für diagnova.codekreativ.at
# (Domains → Apache & nginx → Zusätzliche nginx-Direktiven)
# ODER Plesk Docker Proxy Rule: Domain-Root → Container diagnova-web-1:80
#
# TLS / Let's Encrypt bleibt bei Plesk. Bestehende Sites (z. B. /sv/, masterdesk) unberührt lassen.
# Ziel: Web-Container auf 127.0.0.1:3080

# WebSocket-Map (einmal pro Server-Kontext; bei Plesk-Proxy-Rule oft schon gesetzt)
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

location / {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 25m;
}
